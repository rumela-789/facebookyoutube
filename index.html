<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlasmith</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
html,body,#map{margin:0;height:100%;width:100%;background:#0a0a0a;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
button,input{font:inherit}
button{cursor:pointer;color:#e8eefc;background:#1c1c1e;border:1px solid #3a3a3c;border-radius:12px}
.top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:56px;z-index:2}
.brand{display:inline-block;color:#fff;font-weight:800;letter-spacing:.5px;background:#0a0a0acc;padding:6px 12px;border-radius:12px;margin-bottom:6px;border:1px solid #3a3a3c}
.brand b{color:#bbb}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;font-size:14px;background:#0a0a0acc;backdrop-filter:blur(6px)}
.on{background:#000!important;color:#f0f0f0!important;border:2px solid #8e8e93!important;font-weight:700}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:2;background:#0a0a0aee;backdrop-filter:blur(10px);color:#e8eefc;border-top:1px solid #3a3a3c;border-radius:18px 18px 0 0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
#info{font-size:13px;opacity:.85;min-height:18px;margin:0 2px 6px}
.scroll{max-height:30vh;overflow:auto}
.sec{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.pal{display:flex;gap:8px;overflow-x:auto;padding:2px 0;align-items:center}
.sw{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:2px solid #ffffff88;padding:0}
input[type=color]{width:44px;height:40px;padding:0;border:0;background:none;flex:0 0 auto}
input[type=text]{flex:1;min-width:120px;min-height:42px;padding:0 12px;border:1px solid #3a3a3c;border-radius:12px;background:#141414;color:#fff}
input[type=range]{accent-color:#fff;flex:1;min-width:100px;height:32px}
.btn{min-height:42px;padding:0 14px;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.tab{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.tab i{font-style:normal;font-size:20px}
.it{display:flex;align-items:center;gap:8px;padding:4px 0}.it .c{width:16px;height:16px;border-radius:5px}.it span.n{flex:1}
.it button{min-width:42px;min-height:38px}
.maplibregl-ctrl-group{background:#1c1c1e!important}.maplibregl-ctrl-group button{filter:invert(1)}
.maplibregl-ctrl-attrib{font-size:10px}
</style></head><body>
<div id="map"></div>

<div class="top">
<div class="brand">Atlas<b>smith</b></div>
<div class="chips">
<button id="b_sat" class="chip on" onclick="setBase('sat')">Satellite</button>
<button id="b_map" class="chip" onclick="setBase('map')">Map</button>
<button id="b_bord" class="chip on" onclick="tb()">Borders</button>
<button id="b_3d" class="chip on" onclick="t3()">3D</button>
</div></div>

<div class="dock">
<div id="info">Loading map...</div>
<div class="scroll">
<div id="sec_view" class="sec">
<label style="display:flex;gap:8px;align-items:center;flex:1;min-width:160px">Relief <input type="range" id="ex" min="0.5" max="4" step="0.1" value="1.3"></label>
<button class="btn" onclick="exp()">Export</button><button class="btn" onclick="clr()">Clear all</button>
</div>
<div id="sec_color" class="sec" style="display:none">
<div class="pal" id="pal"></div><input type="color" id="col" value="#ff3b30">
<label style="display:flex;gap:8px;align-items:center;flex:1;min-width:140px">Fill <input type="range" id="op" min="0.1" max="1" step="0.05" value="0.7"></label>
</div>
<div id="sec_paint" class="sec" style="display:none">
<button id="gb" class="btn" onclick="tg()">Group mode</button>
<div id="gwrap" style="display:none;gap:8px;flex:1;min-width:200px;align-items:center"><input type="text" id="gn" placeholder="Group name (e.g. South Asia)"><button class="btn" onclick="doneG()">Done</button><button class="btn" onclick="cancelG()">Cancel</button></div>
</div>
<div id="sec_draw" class="sec" style="display:none">
<input type="text" id="nm" placeholder="Area name (optional)">
<button id="sm" class="btn on" onclick="tsm()">Smooth</button>
<button id="sn" class="btn" onclick="tsn()">Snap</button>
<button class="btn" onclick="undoR()">Undo</button><button class="btn" onclick="redoR()">Redo</button>
</div>
<div id="sec_edit" class="sec" style="display:none">
<label style="display:flex;gap:8px;align-items:center;flex:1;min-width:200px">Soft drag reach <input type="range" id="str" min="20" max="220" step="5" value="80"></label>
</div>
<div id="sec_list" style="display:none"><div id="list"></div></div>
</div>
<div class="tabs">
<button id="m_view" class="tab on" onclick="mode('view')"><i>👆</i>View</button>
<button id="m_paint" class="tab" onclick="mode('paint')"><i>🎨</i>Paint</button>
<button id="m_draw" class="tab" onclick="mode('draw')"><i>✍️</i>Draw</button>
<button id="m_edit" class="tab" onclick="mode('edit')"><i>🔧</i>Edit</button>
</div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
const $=id=>document.getElementById(id),E={type:'FeatureCollection',features:[]};
const NE=['https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_admin_0_countries.geojson','https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson'];
const FONT=['Open Sans Semibold','Arial Unicode MS Bold'];
const map=new maplibregl.Map({container:'map',zoom:2.2,center:[80,25],pitch:35,maxPitch:80,maxZoom:18,fadeDuration:300,maxTileCacheSize:300,
style:{version:8,projection:{type:'globe'},glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
sources:{
sat:{type:'raster',tileSize:256,maxzoom:9,attribution:'Sentinel-2 cloudless © EOX',tiles:['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg']},
esri:{type:'raster',tileSize:256,maxzoom:17,attribution:'Imagery © Esri',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']},
basemap:{type:'raster',tileSize:256,maxzoom:18,attribution:'© OpenStreetMap contributors © CARTO',tiles:['https://basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}.png']},
maplbl:{type:'raster',tileSize:256,maxzoom:18,tiles:['https://basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}.png']},
dem:{type:'raster-dem',encoding:'terrarium',tileSize:256,maxzoom:15,attribution:'Terrain: AWS Open Data',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png']},
osm:{type:'vector',url:'https://tiles.openfreemap.org/planet',attribution:'OpenFreeMap © OpenMapTiles, OSM'},
bord:{type:'geojson',data:E},regions:{type:'geojson',data:E},draft:{type:'geojson',data:E}},
layers:[
{id:'bg',type:'background',paint:{'background-color':'#0a0a0a'}},
{id:'sat',type:'raster',source:'sat',maxzoom:8.5,paint:{'raster-fade-duration':300}},
{id:'esri',type:'raster',source:'esri',minzoom:6.5,paint:{'raster-fade-duration':300}},
{id:'basemap',type:'raster',source:'basemap',layout:{visibility:'none'},paint:{'raster-fade-duration':300}},
{id:'hill',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':.3}},
{id:'cfill',type:'fill',source:'bord',paint:{'fill-color':'rgba(0,0,0,0.01)','fill-opacity':0.7}},
{id:'ncase',type:'line',source:'bord',maxzoom:5.5,paint:{'line-color':'#000','line-opacity':.4,'line-width':['interpolate',['linear'],['zoom'],0,3,5,6]}},
{id:'nline',type:'line',source:'bord',maxzoom:5.5,paint:{'line-color':'#ffd54a','line-width':['interpolate',['linear'],['zoom'],0,1.5,5,3.2]}},
{id:'bcase',type:'line',source:'osm','source-layer':'boundary',minzoom:5.5,filter:['all',['==',['get','admin_level'],2],['!=',['get','maritime'],1]],layout:{'line-join':'round'},paint:{'line-color':'#000','line-opacity':.4,'line-width':['interpolate',['linear'],['zoom'],5,5,12,10]}},
{id:'bline',type:'line',source:'osm','source-layer':'boundary',minzoom:5.5,filter:['all',['==',['get','admin_level'],2],['!=',['get','maritime'],1]],layout:{'line-join':'round'},paint:{'line-color':'#ffd54a','line-width':['interpolate',['linear'],['zoom'],5,2.6,12,6]}},
{id:'cname',type:'symbol',source:'bord',layout:{'text-field':['get','NAME'],'text-font':FONT,'text-size':['interpolate',['linear'],['zoom'],1,10,6,15],'text-max-width':8},paint:{'text-color':'#fff','text-halo-color':'#000','text-halo-width':1.5}},
{id:'rfill',type:'fill',source:'regions',paint:{'fill-color':['get','color'],'fill-opacity':0.7}},
{id:'rcase',type:'line',source:'regions',layout:{'line-join':'round'},paint:{'line-color':'#000','line-opacity':.4,'line-width':['interpolate',['linear'],['zoom'],0,3,5,6,12,10]}},
{id:'rline',type:'line',source:'regions',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#ffd54a','line-width':['interpolate',['linear'],['zoom'],0,1.5,5,3.2,12,6]}},
{id:'maplbl',type:'raster',source:'maplbl',layout:{visibility:'none'}},
{id:'dline',type:'line',source:'draft',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':['coalesce',['get','color'],'#fff'],'line-width':4}}],
terrain:{source:'dem',exaggeration:1.3},sky:{}}});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}));
try{map.addControl(new maplibregl.GlobeControl())}catch(e){}
const cv=map.getCanvas();
let base='sat',M='view',regs=[],rs=[],cmap={},groups=[],pend=new Map(),gOn=false,NEC={},bOn=true,d3=true,smooth=true,snapOn=false,sel=-1,lm=[],vm=[],drawing=false,spts=[],raf=0,sd=null;
const col=$('col'),PAL=['#ff3b30','#ff9500','#ffd60a','#34c759','#22d3ee','#0a84ff','#bf5af2','#ff2d95','#ffffff','#8e8e93'];
$('pal').innerHTML=PAL.map(c=>`<button class="sw" style="background:${c}" onclick="setCol('${c}')"></button>`).join('');
function say(t){$('info').textContent=t}
function setCol(c){col.value=c;if(M=='edit'&&regs[sel]){regs[sel].properties.color=c;upR()}if(pend.size){pend.forEach((v,id)=>{cmap[id]=c});paintC()}}
col.addEventListener('input',()=>setCol(col.value));
/* base + toggles */
function setBase(m){base=m;const sat=m=='sat',bc=sat?'#ffd54a':'#d9480f';
['sat','esri'].forEach(l=>map.setLayoutProperty(l,'visibility',sat?'visible':'none'));
['basemap','maplbl'].forEach(l=>map.setLayoutProperty(l,'visibility',sat?'none':'visible'));
['nline','bline','rline'].forEach(l=>map.setPaintProperty(l,'line-color',bc));
$('b_sat').classList.toggle('on',sat);$('b_map').classList.toggle('on',!sat);tb(1)}
function tb(keep){if(!keep)bOn=!bOn;const v=bOn?'visible':'none';['ncase','nline','bcase','bline'].forEach(l=>map.setLayoutProperty(l,'visibility',v));map.setLayoutProperty('cname','visibility',bOn&&base=='sat'?'visible':'none');$('b_bord').classList.toggle('on',bOn)}
function t3(){d3=!d3;map.setTerrain(d3?{source:'dem',exaggeration:+$('ex').value}:null);$('b_3d').classList.toggle('on',d3)}
$('ex').oninput=e=>{if(d3)map.setTerrain({source:'dem',exaggeration:+e.target.value})};
$('op').oninput=e=>{const v=+e.target.value;map.setPaintProperty('cfill','fill-opacity',v);map.setPaintProperty('rfill','fill-opacity',v)};
function tsm(){smooth=!smooth;$('sm').classList.toggle('on',smooth)}
function tsn(){snapOn=!snapOn;$('sn').classList.toggle('on',snapOn);say(snapOn?'Snap on: your line will stick to country borders (best when borders are visible).':HINT.draw)}
/* country borders data */
async function loadB(){for(const u of NE){try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();map.getSource('bord').setData(j);cents(j);labels();say('Ready. Pick a tool below.');return}catch(e){}}say('Country data failed to load. Check your connection.')}
map.on('error',e=>{if(e.sourceId==='osm')map.setLayerZoomRange('nline',0,24);map.setLayerZoomRange('ncase',0,24)});
function cents(j){j.features.forEach(f=>{const g=f.geometry,ps=g.type=='Polygon'?[g.coordinates]:g.coordinates;let best=null,ba=-1;ps.forEach(p=>{const o=p[0];let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;o.forEach(c=>{x0=Math.min(x0,c[0]);x1=Math.max(x1,c[0]);y0=Math.min(y0,c[1]);y1=Math.max(y1,c[1])});const a=(x1-x0)*(y1-y0);if(a>ba){ba=a;best=[(x0+x1)/2,(y0+y1)/2]}});if(best)NEC[f.properties.ADM0_A3]=best})}
function paintC(){const k=Object.keys(cmap);if(!k.length){map.setPaintProperty('cfill','fill-color','rgba(0,0,0,0.01)');return}
const x=['match',['get','ADM0_A3']];k.forEach(a=>x.push(a,cmap[a]));x.push('rgba(0,0,0,0.01)');map.setPaintProperty('cfill','fill-color',x)}
/* regions */
function save(){try{localStorage.setItem('as_r',JSON.stringify(regs));localStorage.setItem('as_c',JSON.stringify(cmap));localStorage.setItem('as_g',JSON.stringify(groups))}catch(e){}}
function mkL(t,x,y){const d=document.createElement('div');d.textContent=t;d.style.cssText='color:#fff;font-weight:600;font-size:15px;text-shadow:0 0 3px #000,0 0 3px #000,0 0 5px #000;pointer-events:none';return new maplibregl.Marker({element:d}).setLngLat([x,y]).addTo(map)}
function labels(){lm.forEach(m=>m.remove());const a=regs.map(r=>{if(!r.properties.name)return null;const c=r.geometry.coordinates[0].slice(0,-1);return mkL(r.properties.name,c.reduce((s,p)=>s+p[0],0)/c.length,c.reduce((s,p)=>s+p[1],0)/c.length)});
const g=groups.map(o=>{if(!o.name)return null;const cs=o.ids.map(i=>NEC[i]).filter(Boolean);if(!cs.length)return null;return mkL(o.name,cs.reduce((s,p)=>s+p[0],0)/cs.length,cs.reduce((s,p)=>s+p[1],0)/cs.length)});lm=a.concat(g).filter(Boolean)}
function upR(){map.getSource('regions').setData({type:'FeatureCollection',features:regs});labels();vtx();
$('list').innerHTML=regs.map((r,i)=>`<div class="it"><span class="c" style="background:${r.properties.color}"></span><span class="n">${r.properties.name||'Area '+(i+1)}</span><button onclick="selR(${i})">Edit</button><button onclick="delR(${i})">✕</button></div>`).join('')+groups.map((g,i)=>`<div class="it"><span class="c" style="background:${g.color}"></span><span class="n">${g.name||'Group '+(i+1)} (${g.ids.length} countries)</span><button onclick="delG(${i})">✕</button></div>`).join('');save()}
function delR(i){regs.splice(i,1);sel=-1;upR()}
function undoR(){if(regs.length){rs.push(regs.pop());sel=-1;upR()}}
function redoR(){if(rs.length){regs.push(rs.pop());upR()}}
function clr(){if(confirm('Remove all painted countries, groups and drawn areas?')){regs=[];rs=[];cmap={};groups=[];pend.clear();sel=-1;paintC();upR()}}
function tg(){gOn=!gOn;$('gb').classList.toggle('on',gOn);$('gwrap').style.display=gOn?'flex':'none';if(!gOn)cancelG();say(gOn?'Group mode: tap countries to add or remove them, then press Done.':HINT.paint)}
function cancelG(){pend.forEach((v,id)=>{if(v===undefined)delete cmap[id];else cmap[id]=v});pend.clear();paintC();say(HINT.paint)}
function doneG(){if(!pend.size){say('Select some countries first.');return}groups.push({name:$('gn').value.trim(),color:col.value,ids:[...pend.keys()]});pend.clear();$('gn').value='';upR();say('Group created.')}
function delG(i){groups[i].ids.forEach(id=>{delete cmap[id]});groups.splice(i,1);paintC();upR()}
function exp(){const b=new Blob([JSON.stringify({regions:{type:'FeatureCollection',features:regs},countries:cmap,groups:groups})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='atlasmith-map.json';a.click()}
/* modes */
const HINT0=1;const HINT={view:'Tap the map to read elevation. Drag to move, pinch to zoom.',paint:'Pick a color, then tap a country. Tap again with the same color to clear it.',draw:'Drag your finger on the map to draw an area. Lift to finish. Pinch to zoom. Turn on Snap to stick to borders.',edit:'Pick an area from the list. Then drag along its border to bend it like clay, or move the dots. Tap a dot to delete it.'};
function mode(m){M=m;['view','paint','draw','edit'].forEach(x=>$('m_'+x).classList.toggle('on',x==m));
$('sec_view').style.display=m=='view'?'flex':'none';$('sec_paint').style.display=m=='paint'?'flex':'none';$('sec_edit').style.display=m=='edit'?'flex':'none';$('sec_color').style.display=m=='view'?'none':'flex';$('sec_draw').style.display=m=='draw'?'flex':'none';$('sec_list').style.display=m=='view'?'none':'block';
if(m=='draw'){map.dragPan.disable();map.doubleClickZoom.disable();cv.style.cursor='crosshair'}else{map.dragPan.enable();map.doubleClickZoom.enable();cv.style.cursor=''}
if(m=='draw'||m=='edit')map.easeTo({pitch:0,duration:500});
if(m!='paint'&&gOn)tg();
drawing=false;spts=[];sd=null;setDraft([]);vtx();say(HINT[m])}
/* freehand drawing */
function pt(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function setDraft(p){const s=map.getSource('draft');if(!s)return;s.setData(p.length<2?E:{type:'FeatureCollection',features:[{type:'Feature',properties:{color:col.value},geometry:{type:'LineString',coordinates:p.map(a=>{const l=map.unproject(a);return [l.lng,l.lat]})}}]})}
function cap(e){try{cv.setPointerCapture(e.pointerId)}catch(x){}}
function dens(s){const n=s.length;let per=0;for(let i=0;i<n;i++){const a=s[i],b=s[(i+1)%n];per+=Math.hypot(b[0]-a[0],b[1]-a[1])}const st=Math.max(6,per/1500),o=[];for(let i=0;i<n;i++){const a=s[i],b=s[(i+1)%n],d=Math.hypot(b[0]-a[0],b[1]-a[1]),k=Math.max(1,Math.ceil(d/st));for(let j=0;j<k;j++)o.push([a[0]+(b[0]-a[0])*j/k,a[1]+(b[1]-a[1])*j/k])}return o}
cv.addEventListener('pointerdown',e=>{
if(!e.isPrimary){drawing=false;spts=[];setDraft([]);if(sd){sd=null;map.dragPan.enable()}return}
if(M=='draw'){drawing=true;spts=[pt(e)];cap(e)}
else if(M=='edit'&&regs[sel]){const p=pt(e),s0=dens(regs[sel].geometry.coordinates[0].slice(0,-1).map(c=>{const q=map.project(c);return [q.x,q.y]}));let m=1e9;s0.forEach(q=>{m=Math.min(m,Math.hypot(q[0]-p[0],q[1]-p[1]))});
if(m<40){sd={p0:p,base:s0};map.dragPan.disable();cap(e)}}});
cv.addEventListener('pointermove',e=>{
if(drawing){const p=pt(e),l=spts[spts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<3)return;spts.push(p);if(!raf)raf=requestAnimationFrame(()=>{raf=0;setDraft(spts)})}
else if(sd){const p=pt(e),dx=p[0]-sd.p0[0],dy=p[1]-sd.p0[1],sg=+$('str').value;
sd.cur=sd.base.map(b=>{const d=Math.hypot(b[0]-sd.p0[0],b[1]-sd.p0[1]),w=Math.exp(-(d*d)/(2*sg*sg));return [b[0]+dx*w,b[1]+dy*w]});
if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(sd&&sd.cur){const r=sd.cur.map(a=>{const l=map.unproject(a);return [l.lng,l.lat]});r.push(r[0]);regs[sel].geometry.coordinates[0]=r;map.getSource('regions').setData({type:'FeatureCollection',features:regs})}})}});
function endSD(){if(!sd)return;const s0=sd;sd=null;map.dragPan.enable();if(!s0.cur)return;let q=rdp(s0.cur.concat([s0.cur[0]]),1.5);if(q.length<4)q=s0.cur.concat([s0.cur[0]]);
regs[sel].geometry.coordinates[0]=q.map(a=>{const l=map.unproject(a);return [l.lng,l.lat]});upR()}
cv.addEventListener('pointerup',()=>{endS();endSD()});
cv.addEventListener('pointercancel',()=>{drawing=false;spts=[];setDraft([]);if(sd){sd=null;map.dragPan.enable();upR()}});
function pd(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;if(!l)return Math.hypot(p[0]-a[0],p[1]-a[1]);const t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function rdp(p,t){if(p.length<3)return p;let m=0,ix=0;const a=p[0],b=p[p.length-1];for(let i=1;i<p.length-1;i++){const d=pd(p[i],a,b);if(d>m){m=d;ix=i}}if(m>t){const l=rdp(p.slice(0,ix+1),t),r=rdp(p.slice(ix),t);return l.slice(0,-1).concat(r)}return [a,b]}
function chaikin(p,n){for(let k=0;k<n;k++){const o=[];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];o.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]],[.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]])}p=o}return p}
function rOf(g){const c=g.coordinates;return g.type=='LineString'?[c]:(g.type=='MultiLineString'||g.type=='Polygon')?c:g.type=='MultiPolygon'?c.flat():[]}
function snapP(a){const T=14,l=map.unproject(a),l2=map.unproject([a[0]+1,a[1]]),k=Math.cos(l.lat*Math.PI/180),dpp=Math.hypot((l2.lng-l.lng)*k,l2.lat-l.lat),tol=T*dpp;
const fs=map.queryRenderedFeatures([[a[0]-T,a[1]-T],[a[0]+T,a[1]+T]],{layers:['bline','nline']});let best=tol,out=null;
fs.forEach(f=>rOf(f.geometry).forEach(r=>{for(let i=0;i<r.length-1;i++){const p=r[i],q=r[i+1],ax=p[0]*k,ay=p[1],dx=q[0]*k-ax,dy=q[1]-ay,L=dx*dx+dy*dy;let t=L?(((l.lng*k-ax)*dx+(l.lat-ay)*dy)/L):0;t=t<0?0:t>1?1:t;const px=ax+t*dx,py=ay+t*dy,d=Math.hypot(l.lng*k-px,l.lat-py);if(d<best){best=d;out=[px/k,py]}}}));
if(!out)return a;const s1=map.project(out);return [s1.x,s1.y]}
function snapS(p){const o=[];p.forEach(a=>{const b=snapP(a),l=o[o.length-1];if(!l||Math.hypot(b[0]-l[0],b[1]-l[1])>=2)o.push(b)});return rdp(o,1.2)}
function endS(){if(!drawing)return;drawing=false;const p=spts;spts=[];setDraft([]);
if(p.length<8){say('Too short. Draw a bigger shape.');return}
let q;if(snapOn){q=snapS(p)}else{q=rdp(p,2.5);if(smooth)q=chaikin(q,2)}
if(q.length<3){say('Too short. Draw a bigger shape.');return}
const ring=q.map(a=>{const l=map.unproject(a);return [l.lng,l.lat]});ring.push(ring[0]);
regs.push({type:'Feature',properties:{color:col.value,name:$('nm').value.trim()},geometry:{type:'Polygon',coordinates:[ring]}});rs=[];$('nm').value='';upR();say('Area added. Draw another, or use Edit to reshape.')}
/* edit vertices */
function selR(i){sel=i;col.value=regs[i].properties.color;mode('edit');sel=i;vtx();say(HINT.edit)}
function vtx(){vm.forEach(m=>m.remove());vm=[];if(M!='edit'||!regs[sel])return;const ring=regs[sel].geometry.coordinates[0];
if(ring.length>100)return;
ring.slice(0,-1).forEach((p,k)=>{const d=document.createElement('div');d.className='vtx';d.style.cssText='width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #000;box-shadow:0 0 0 1px #fff;cursor:grab';
const mk=new maplibregl.Marker({element:d,draggable:true}).setLngLat(p).addTo(map);let dr=false;
mk.on('dragstart',()=>{dr=true});
mk.on('dragend',()=>{setTimeout(()=>{dr=false},300);const l=mk.getLngLat(),r=regs[sel].geometry.coordinates[0];r[k]=[l.lng,l.lat];if(k==0)r[r.length-1]=[l.lng,l.lat];map.getSource('regions').setData({type:'FeatureCollection',features:regs});labels();save()});
d.addEventListener('click',ev=>{ev.stopPropagation();if(dr)return;const r=regs[sel].geometry.coordinates[0];if(r.length<=4)return;r.splice(k,1);r[r.length-1]=[...r[0]];upR()});vm.push(mk)})}
function addV(ll){if(!regs[sel]){say('Select an area from the list first.');return}
const r=regs[sel].geometry.coordinates[0],p=[ll.lng,ll.lat];let best=0,bd=1e9;
for(let i=0;i<r.length-1;i++){const a=r[i],b=r[i+1],dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);if(d<bd){bd=d;best=i}}
r.splice(best+1,0,p);upR()}
/* taps */
map.on('click',e=>{
if(e.originalEvent&&e.originalEvent.target.closest&&e.originalEvent.target.closest('.vtx'))return;
if(M=='edit'){addV(e.lngLat);return}
if(M=='paint'){const f=map.queryRenderedFeatures(e.point,{layers:['cfill']})[0];if(!f)return;const id=f.properties.ADM0_A3;
if(gOn){if(pend.has(id)){const pv=pend.get(id);if(pv===undefined)delete cmap[id];else cmap[id]=pv;pend.delete(id)}else{pend.set(id,cmap[id]);cmap[id]=col.value}paintC();say(pend.size+' selected. Press Done to make a group.');return}
if(cmap[id]===col.value)delete cmap[id];else cmap[id]=col.value;say('Painted: '+(f.properties.NAME||id));paintC();save();return}
if(M=='view'){const h=map.queryTerrainElevation(e.lngLat);say(`${e.lngLat.lat.toFixed(3)}, ${e.lngLat.lng.toFixed(3)}  ·  Elevation: ${h==null?'n/a (turn on 3D)':Math.round(h).toLocaleString()+' m'}`)}});
map.on('load',()=>{try{regs=JSON.parse(localStorage.getItem('as_r'))||[];cmap=JSON.parse(localStorage.getItem('as_c'))||{};groups=JSON.parse(localStorage.getItem('as_g'))||[]}catch(e){}paintC();upR();mode('view');loadB()});
</script></body></html>
