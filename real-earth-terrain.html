<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Studio - নিজের ম্যাপ আঁকুন</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
html,body,#map{margin:0;height:100%;width:100%;font-family:system-ui,sans-serif}
button,input,select{font:inherit}
.top{position:absolute;top:8px;left:8px;z-index:2;display:flex;flex-direction:column;gap:6px}
.top button,.pnl button{background:#fff;border:0;border-radius:10px;padding:8px 11px;box-shadow:0 2px 8px #0004;font-size:13px}
.pnl{position:absolute;bottom:0;left:0;right:0;z-index:2;background:#fffe;padding:8px 10px;max-height:46%;overflow:auto;border-radius:14px 14px 0 0;font-size:13px}
.r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
.on{background:#e5322d!important;color:#fff}
input[type=color]{width:42px;height:34px;padding:0;border:0;background:none}
input[type=text]{flex:1;min-width:90px;padding:7px;border:1px solid #bbb;border-radius:8px}
.it{display:flex;align-items:center;gap:6px;padding:3px 0}.sw{width:14px;height:14px;border-radius:4px}
</style></head><body>
<div id="map"></div>
<div class="top">
<button onclick="setBase('sat')">🛰 স্যাটেলাইট</button>
<button onclick="setBase('topo')">🗺 টপো</button>
<button onclick="tb()">🏳 আসল সীমানা</button>
</div>
<div class="pnl">
<div class="r">
<button id="m_view" class="on" onclick="mode('view')">👆 দেখুন</button>
<button id="m_country" onclick="mode('country')">🎨 দেশ রাঙান</button>
<button id="m_draw" onclick="mode('draw')">✏️ আঁকুন</button>
<button id="m_edit" onclick="mode('edit')">🔧 এডিট</button>
<input type="color" id="col" value="#ff3b30">
</div>
<div id="drawui" style="display:none">
<div class="r"><input type="text" id="nm" placeholder="এলাকার নাম (ঐচ্ছিক)">
<button onclick="finish()">✅ শেষ</button><button onclick="undo()">↩️</button><button onclick="redo()">↪️</button><button onclick="cancelD()">✖</button></div>
</div>
<div class="r">ঘনত্ব <input type="range" id="op" min="0.1" max="0.9" step="0.05" value="0.5" oninput="setOp()">
<button onclick="exp()">⬇ GeoJSON</button><button onclick="clr()">🗑 সব মুছুন</button></div>
<div id="info">দেশ রাঙাতে "দেশ রাঙান" চেপে দেশে ট্যাপ করুন। এলাকা আঁকতে পয়েন্টে পয়েন্টে ট্যাপ করে "শেষ" চাপুন।</div>
<div id="list"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
const empty={type:'FeatureCollection',features:[]};
const map=new maplibre.Map({container:'map',zoom:2,center:[85,27],pitch:35,maxPitch:85,doubleClickZoom:false,
style:{version:8,projection:{type:'globe'},glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
sources:{
sat:{type:'raster',tileSize:256,maxzoom:9,attribution:'Sentinel-2 cloudless © EOX',tiles:['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg']},
esri:{type:'raster',tileSize:256,maxzoom:19,attribution:'Imagery © Esri',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']},
topo:{type:'raster',tileSize:256,maxzoom:17,attribution:'© OpenTopoMap',tiles:['https://tile.opentopomap.org/{z}/{x}/{y}.png']},
bord:{type:'geojson',data:'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson'},
dem:{type:'raster-dem',encoding:'terrarium',tileSize:256,maxzoom:15,attribution:'Terrain: AWS Open Data',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png']},
regions:{type:'geojson',data:empty},draft:{type:'geojson',data:empty}},
layers:[
{id:'esri',type:'raster',source:'esri',minzoom:8},
{id:'sat',type:'raster',source:'sat',maxzoom:9.5},
{id:'topo',type:'raster',source:'topo',layout:{visibility:'none'}},
{id:'hill',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':.3}},
{id:'cfill',type:'fill',source:'bord',paint:{'fill-color':'rgba(0,0,0,0.01)','fill-opacity':0.5}},
{id:'borders',type:'line',source:'bord',paint:{'line-color':'#ffd54a','line-width':['interpolate',['linear'],['zoom'],1,.8,6,2]}},
{id:'cname',type:'symbol',source:'bord',layout:{'text-field':['get','NAME'],'text-font':['Open Sans Semibold','Arial Unicode MS Bold'],'text-size':['interpolate',['linear'],['zoom'],1,10,6,15]},paint:{'text-color':'#fff','text-halo-color':'#000','text-halo-width':1.5}},
{id:'rfill',type:'fill',source:'regions',paint:{'fill-color':['get','color'],'fill-opacity':0.5}},
{id:'rline',type:'line',source:'regions',paint:{'line-color':['get','color'],'line-width':3.5}},
{id:'dline',type:'line',source:'draft',filter:['==','$type','LineString'],paint:{'line-color':'#fff','line-width':3,'line-dasharray':[2,1]}},
{id:'dpt',type:'circle',source:'draft',filter:['==','$type','Point'],paint:{'circle-radius':6,'circle-color':'#e5322d','circle-stroke-color':'#fff','circle-stroke-width':2}}],
terrain:{source:'dem',exaggeration:1.3},sky:{}}});
map.addControl(new maplibre.NavigationControl({visualizePitch:true}));
map.addControl(new maplibre.GlobeControl());

let M='view',pts=[],rs=[],regs=[],cmap={},on=true,sel=-1,lm=[],vm=[];
const $=id=>document.getElementById(id),col=$('col');
function setBase(m){const s=m=='sat';map.setLayoutProperty('esri','visibility',s?'visible':'none');map.setLayoutProperty('sat','visibility',s?'visible':'none');map.setLayoutProperty('topo','visibility',s?'none':'visible')}
function tb(){on=!on;['borders','cname'].forEach(l=>map.setLayoutProperty(l,'visibility',on?'visible':'none'))}
function setOp(){const v=+$('op').value;map.setPaintProperty('cfill','fill-opacity',v);map.setPaintProperty('rfill','fill-opacity',v)}
function mode(m){M=m;['view','country','draw','edit'].forEach(x=>$('m_'+x).classList.toggle('on',x==m));$('drawui').style.display=m=='draw'?'block':'none';if(m!='draw')cancelD();vtx()}
function paintC(){const e=['match',['get','ADM0_A3']];Object.entries(cmap).forEach(([k,v])=>e.push(k,v));e.push('rgba(0,0,0,0.01)');
map.setPaintProperty('cfill','fill-color',Object.keys(cmap).length?e:'rgba(0,0,0,0.01)')}
function drawDraft(){const f=pts.map(p=>({type:'Feature',properties:{},geometry:{type:'Point',coordinates:p}}));
if(pts.length>1)f.push({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:pts.length>2?[...pts,pts[0]]:pts}});
map.getSource('draft').setData({type:'FeatureCollection',features:f})}
function undo(){if(pts.length)rs.push(pts.pop());drawDraft()}function redo(){if(rs.length)pts.push(rs.pop());drawDraft()}function cancelD(){pts=[];rs=[];drawDraft()}
function finish(){if(pts.length<3){alert('কমপক্ষে ৩টি পয়েন্ট দিন');return}
regs.push({type:'Feature',properties:{color:col.value,name:$('nm').value||''},geometry:{type:'Polygon',coordinates:[[...pts,pts[0]]]}});
$('nm').value='';cancelD();upR()}
function upR(){map.getSource('regions').setData({type:'FeatureCollection',features:regs});labels();vtx();
$('list').innerHTML=regs.map((r,i)=>`<div class="it"><span class="sw" style="background:${r.properties.color}"></span><span style="flex:1">${r.properties.name||'এলাকা '+(i+1)}</span><button onclick="selR(${i})">✎</button><button onclick="delR(${i})">✕</button></div>`).join('');
try{localStorage.setItem('es_r',JSON.stringify(regs));localStorage.setItem('es_c',JSON.stringify(cmap))}catch(e){}}
function delR(i){regs.splice(i,1);sel=-1;upR()}
function clr(){if(confirm('সব রং ও এলাকা মুছবেন?')){regs=[];cmap={};paintC();upR()}}
function exp(){const b=new Blob([JSON.stringify({regions:{type:'FeatureCollection',features:regs},countries:cmap})],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-map.geojson';a.click()}
function save(){try{localStorage.setItem('es_r',JSON.stringify(regs));localStorage.setItem('es_c',JSON.stringify(cmap))}catch(e){}}
function labels(){lm.forEach(m=>m.remove());lm=regs.map(r=>{if(!r.properties.name)return null;const c=r.geometry.coordinates[0].slice(0,-1);const x=c.reduce((a,p)=>a+p[0],0)/c.length,y=c.reduce((a,p)=>a+p[1],0)/c.length;const d=document.createElement('div');d.textContent=r.properties.name;d.style.cssText='color:#fff;font-weight:700;font-size:16px;text-shadow:0 0 4px #000,0 0 4px #000;pointer-events:none';return new maplibre.Marker({element:d}).setLngLat([x,y]).addTo(map)}).filter(Boolean)}
function selR(i){sel=i;mode('edit');col.value=regs[i].properties.color;vtx();$('info').textContent='🔧 পয়েন্ট টেনে সরান · পয়েন্টে ট্যাপ = মুছুন · বর্ডারের কাছে ম্যাপে ট্যাপ = নতুন পয়েন্ট · রং বদলালে এলাকার রং বদলাবে'}
function vtx(){vm.forEach(m=>m.remove());vm=[];if(M!='edit'||sel<0||!regs[sel])return;const ring=regs[sel].geometry.coordinates[0];
ring.slice(0,-1).forEach((p,k)=>{const d=document.createElement('div');d.style.cssText='width:20px;height:20px;border-radius:50%;background:#22d3ee;border:2px solid #fff;cursor:grab';
const mk=new maplibre.Marker({element:d,draggable:true}).setLngLat(p).addTo(map);
mk.on('dragend',()=>{const l=mk.getLngLat(),r=regs[sel].geometry.coordinates[0];r[k]=[l.lng,l.lat];if(k==0)r[r.length-1]=[l.lng,l.lat];map.getSource('regions').setData({type:'FeatureCollection',features:regs});labels();save()});
d.addEventListener('click',ev=>{ev.stopPropagation();const r=regs[sel].geometry.coordinates[0];if(r.length<=4)return;r.splice(k,1);r[r.length-1]=[...r[0]];upR()});
vm.push(mk)})}
function addV(ll){if(sel<0||!regs[sel]){$('info').textContent='আগে তালিকা থেকে ✎ চেপে এলাকা বেছে নিন';return}
const r=regs[sel].geometry.coordinates[0],p=[ll.lng,ll.lat];let best=0,bd=1e9;
for(let i=0;i<r.length-1;i++){const a=r[i],b=r[i+1],dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);if(d<bd){bd=d;best=i}}
r.splice(best+1,0,p);upR()}
col.addEventListener('input',()=>{if(M=='edit'&&sel>=0&&regs[sel]){regs[sel].properties.color=col.value;upR()}});
map.on('click',e=>{
if(M=='edit'){addV(e.lngLat);return}
if(M=='draw'){pts.push([e.lngLat.lng,e.lngLat.lat]);drawDraft();return}
if(M=='country'){const f=map.queryRenderedFeatures(e.point,{layers:['cfill']})[0];if(!f)return;
const id=f.properties.ADM0_A3;if(cmap[id]===col.value)delete cmap[id];else cmap[id]=col.value;
$('info').textContent='🎨 '+(f.properties.NAME||id)+' রাঙানো হয়েছে (একই রঙে আবার ট্যাপ করলে মুছবে)';paintC();upR();return}
const h=map.queryTerrainElevation(e.lngLat);$('info').textContent=`📍 ${e.lngLat.lat.toFixed(3)}, ${e.lngLat.lng.toFixed(3)} · উচ্চতা ${h==null?'?':Math.round(h)+' মি'}`});
map.on('load',()=>{try{regs=JSON.parse(localStorage.getItem('es_r'))||[];cmap=JSON.parse(localStorage.getItem('es_c'))||{}}catch(e){}paintC();upR()});
</script></body></html>
